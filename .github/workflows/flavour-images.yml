name: Flavour images

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flavour-images
  cancel-in-progress: false

jobs:
  build-release:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    permissions:
      actions: write
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      RELEASE_TAG: v0.2.0-alpha.${{ github.run_number }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Restore shared build cache
        uses: nix-community/cache-nix-action/restore@v7
        with:
          primary-key: nox-build-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-prefixes-first-match: nox-build-v1-
      - name: Check installer runtime before building images
        run: nix build --no-update-lock-file .#checks.x86_64-linux.installer-runtime --no-link
      - name: Create draft release
        id: draft
        run: |
          gh release create "$RELEASE_TAG" --target "$SOURCE_SHA" --draft --prerelease \
            --title "Nox $RELEASE_TAG" --notes "Preview images built from $SOURCE_SHA. Hyprland and Niri are UEFI boot-tested; OCI is runtime-tested with Docker; WSL is archive-validated and still requires Windows WSL2 validation. Each image includes SHA-256 and provenance."
      - name: Build, validate and upload all images serially
        run: bash scripts/build-release.sh
      - name: Bound cache to 6 GiB
        id: cache-size
        run: |
          limit=6442450944
          store_bytes="$(du -sb /nix/store | cut -f1)"
          if (( store_bytes > limit - 268435456 )); then
            nix store gc --max "$((store_bytes - limit + 268435456))"
          fi
          cache_bytes="$(du -sb /nix | cut -f1)"
          if (( cache_bytes <= limit )); then
            echo "save=true" >> "$GITHUB_OUTPUT"
          else
            echo "save=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Rooted store exceeds 6 GiB; retaining previous cache instead."
          fi
      - name: Save replacement cache
        if: steps.cache-size.outputs.save == 'true'
        uses: nix-community/cache-nix-action/save@v7
        with:
          primary-key: nox-build-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Publish complete release
        id: publish
        run: gh release edit "$RELEASE_TAG" --draft=false
      - name: Remove old Nox preview images and stale Actions artifacts
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        with:
          script: |
            const cleanup = require('./.github/scripts/release-cleanup.cjs');
            await cleanup({ github, context, core, tag: process.env.RELEASE_TAG });
      - name: Remove failed draft
        if: failure() && steps.draft.outcome == 'success' && steps.publish.outcome != 'success'
        run: gh release delete "$RELEASE_TAG" --cleanup-tag --yes

  cache-retention:
    needs: build-release
    if: always() && needs.build-release.result != 'skipped'
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Keep exactly one Nox build cache across refs
        uses: actions/github-script@v7
        with:
          script: |
            const retain = require('./.github/scripts/cache-retention.cjs');
            await retain({ github, context, core });
