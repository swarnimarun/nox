name: CI

on:
  push:
    branches:
      - main
      - "recovery/**"
    paths:
      - ".github/workflows/**"
      - "Cargo.lock"
      - "Cargo.toml"
      - "crates/**"
      - "flake.lock"
      - "flake.nix"
      - "nix/**"
      - "installer/**"
      - "examples/**"
      - "scripts/**"
      - "tests/**"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --locked
      - run: cargo build -p noxctl --locked
      - run: python3 -m unittest discover -s tests/cli -v
      - run: python3 -m py_compile installer/nox-installer.py tests/boot_iso.py tests/boot_qcow2.py
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  nix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - uses: dtolnay/rust-toolchain@stable
      - name: Check Nix formatting
        run: |
          nix fmt .
          git diff --exit-code
      - run: nix flake check --no-update-lock-file --show-trace
