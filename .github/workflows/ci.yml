name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo generate-lockfile && cargo fmt --all
      - run: cargo test --workspace --locked && cargo build -p noxctl --locked
      - run: python3 -m unittest discover -s tests/cli -v
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Export generated source for review
        if: always()
        run: |
          python3 - <<'PYEXPORT'
          import pathlib, json, zlib, base64
          paths = [pathlib.Path('Cargo.lock'), pathlib.Path('flake.lock'), pathlib.Path('flake.nix')]
          paths += list(pathlib.Path('crates').rglob('*.rs')) + list(pathlib.Path('nix').rglob('*.nix')) + list(pathlib.Path('examples').rglob('*.nix')) + list(pathlib.Path('tests/nix').rglob('*.nix'))
          data = {str(p): p.read_text() for p in paths if p.is_file()}
          print('NOX_GENERATED_SOURCES=' + base64.b64encode(zlib.compress(json.dumps(data).encode())).decode())
          PYEXPORT
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rust-reviewed-sources
          path: |
            Cargo.lock
            crates/
  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo generate-lockfile && nix flake lock && git add Cargo.lock flake.lock
      - run: nix fmt .
      - name: Export generated source for review
        if: always()
        run: |
          python3 - <<'PYEXPORT'
          import pathlib, json, zlib, base64
          paths = [pathlib.Path('Cargo.lock'), pathlib.Path('flake.lock'), pathlib.Path('flake.nix')]
          paths += list(pathlib.Path('crates').rglob('*.rs')) + list(pathlib.Path('nix').rglob('*.nix')) + list(pathlib.Path('examples').rglob('*.nix')) + list(pathlib.Path('tests/nix').rglob('*.nix'))
          data = {str(p): p.read_text() for p in paths if p.is_file()}
          print('NOX_GENERATED_SOURCES=' + base64.b64encode(zlib.compress(json.dumps(data).encode())).decode())
          PYEXPORT
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nix-reviewed-sources
          path: |
            flake.lock
            flake.nix
            nix/
            tests/nix/
      - run: nix flake check --no-update-lock-file --show-trace
  images:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [iso, qcow2, wsl, oci]
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - uses: dtolnay/rust-toolchain@stable
      - run: nix build --no-update-lock-file .#${{ matrix.target }}
      - if: matrix.target == 'oci'
        run: |
          docker load --input result
          docker run --rm nox-workspace:dev /bin/bash -lc 'noxctl --help && git --version'
      - run: |
          mkdir artifacts
          cp -rL result artifacts/result
      - uses: actions/upload-artifact@v4
        with:
          name: nox-${{ matrix.target }}-x86_64-linux
          path: artifacts/
