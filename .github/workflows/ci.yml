name: CI

on:
  push:
    branches:
      - main
      - "recovery/**"
    paths:
      - ".github/workflows/**"
      - "Cargo.lock"
      - "Cargo.toml"
      - "crates/**"
      - "flake.lock"
      - "flake.nix"
      - "nix/**"
      - "installer/**"
      - "examples/**"
      - "scripts/**"
      - "tests/**"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --locked
      - run: cargo build -p noxctl --locked
      - run: python3 -m unittest discover -s tests/cli -v
      - run: python3 -m py_compile installer/nox-installer.py tests/boot_iso.py tests/boot_qcow2.py
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  nix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - uses: dtolnay/rust-toolchain@stable
      - name: Check Nix formatting
        run: |
          nix fmt .
          git diff --exit-code
      - run: nix flake check --no-update-lock-file --show-trace
      - name: Validate generated project and dotfiles flakes
        run: |
          cargo run --locked -p noxctl -- dotfiles init "$RUNNER_TEMP/nox-dotfiles" --username nox --no-lock
          cargo run --locked -p noxctl -- setup "$RUNNER_TEMP/nox-machine" \
            --source "path:$GITHUB_WORKSPACE" \
            --profile desktop \
            --target qcow2 \
            --flavour niri \
            --dotfiles-flake "path:$RUNNER_TEMP/nox-dotfiles"
          test "$(nix eval --no-update-lock-file --raw \
            "path:$RUNNER_TEMP/nox-machine#nixosConfigurations.nox.config.home-manager.users.nox.home.username")" = nox
          nix eval --no-update-lock-file --raw \
            "path:$RUNNER_TEMP/nox-machine#nixosConfigurations.nox.config.system.build.toplevel.drvPath"
          cargo run --locked -p noxctl -- upgrade list \
            --config "$RUNNER_TEMP/nox-machine/nox.toml"
  release-output-smoke:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Build and boot-test the exact Hyprland ISO
        id: hyprland
        continue-on-error: true
        run: |
          nix build --no-update-lock-file .#hyprland-iso --out-link result-iso
          image="$(find -L result-iso/iso -maxdepth 1 -type f -name '*.iso' -print -quit)"
          test -n "$image"
          nix run --no-update-lock-file .#iso-smoke -- "$image" \
            --expect-flavour hyprland --timeout 900 --log hyprland-boot-console.log
      - name: Build and validate the WSL output
        run: |
          nix build --no-update-lock-file .#wsl --out-link result-wsl
          image="$RUNNER_TEMP/nox-wsl-x86_64-linux.wsl"
          sudo ./result-wsl/bin/nixos-wsl-tarball-builder "$image"
          test -s "$image"
          test "$(stat --format=%s "$image")" -gt 104857600
          tar -tzf "$image" | grep -qx './etc/wsl-distribution.conf'
          tar -tzf "$image" | grep -qx './etc/nixos/configuration.nix'
      - name: Fail if the Hyprland boot gate failed
        if: steps.hyprland.outcome == 'failure'
        run: exit 1
